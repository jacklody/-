<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能日历助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4f8;--card:#ffffff;--border:#e2e8f0;--primary:#4a9eff;
  --text:#1a202c;--muted:#718096;
  --red:#ff4757;--yellow:#ffa502;--blue:#4a9eff;--green:#2ed573;
  --radius:8px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#a0aec0}

/* ============ 布局 ============ */
#app{display:flex;flex-direction:column;height:100%}

/* 顶栏 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo{font-size:20px}
.topbar h1{font-size:18px;font-weight:600}
.topbar-sub{font-size:12px;color:var(--muted);margin-top:2px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;
  transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text);
}
.btn:hover{border-color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:#3a8eef}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#e63b4a}

.view-switch{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.view-switch button{
  padding:8px 16px;font-size:13px;font-weight:500;
  background:var(--card);color:var(--muted);transition:all .15s;
}
.view-switch button:hover{color:var(--text)}
.view-switch button.active{background:var(--primary);color:#fff}

/* 统计面板 - 紧凑 */
.stats{
  display:flex;gap:10px;padding:8px 20px;background:var(--card);
  border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;
}
.stat-item{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:var(--radius);background:var(--bg);border:1px solid var(--border);
  font-size:13px;cursor:pointer;transition:all .15s;
}
.stat-item:hover{border-color:var(--primary);background:rgba(74,158,255,.06)}
.stat-item.active{border-color:var(--primary);background:rgba(74,158,255,.12)}
.stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.stat-num{font-weight:700;font-size:15px}
.stat-label{color:var(--muted)}

/* 主体 */
.main{display:flex;flex:1;overflow:hidden}

/* 日历区域 */
.calendar-panel{
  width:440px;flex-shrink:0;padding:12px;
  border-right:1px solid var(--border);overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
}
.cal-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-title{font-size:18px;font-weight:600}
.cal-nav{display:flex;gap:4px}
.cal-nav button{
  width:32px;height:32px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.cal-nav button:hover{border-color:var(--primary);color:var(--primary)}
.cal-today-btn{
  padding:0 12px;height:32px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);font-size:12px;color:var(--muted);transition:all .15s;
}
.cal-today-btn:hover{border-color:var(--primary);color:var(--primary)}
.cal-jump{display:flex;align-items:center;gap:6px}
.cal-jump-label{font-size:12px;color:var(--muted);white-space:nowrap}
.cal-jump input{
  width:140px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:12px;
}
.cal-jump input:focus{outline:none;border-color:var(--primary)}

/* 月历 */
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-weekday{padding:6px 0;font-size:12px;color:var(--muted);font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{
  min-height:72px;display:flex;flex-direction:column;
  border-radius:8px;cursor:pointer;transition:all .15s;
  font-size:13px;border:2px solid transparent;overflow:hidden;
  padding:3px;
}
.cal-day:hover{background:rgba(74,158,255,.08)}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700}
.cal-day.selected{border-color:var(--primary)}
.cal-day.other-month{color:var(--muted);opacity:.35}
.cal-day-header{display:flex;align-items:center;justify-content:space-between;padding:0 2px 2px}
.cal-day-num{font-size:13px;font-weight:600}
.cal-day-todos{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-day-todo-item{
  display:flex;align-items:center;gap:3px;padding:1px 5px;
  border-radius:3px;font-size:10px;font-weight:500;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:grab;transition:all .12s;
}
.cal-day-todo-item:hover{filter:brightness(1.1);transform:scale(1.02)}
.cal-day-todo-item.dragging{opacity:.4}
.cal-day-todo-item.selected{outline:2px solid #fff;outline-offset:-1px;box-shadow:0 0 0 2px var(--primary)}
.cal-day-todo-item.done{opacity:.65;text-decoration:line-through}
.cal-day-more{
  font-size:10px;color:var(--muted);padding:0 4px;
}
.cal-day:not(.other-month) .cal-day-todo-item{color:#fff}
.cal-day.today .cal-day-todo-item{background:rgba(255,255,255,.25)!important}
.cal-day.today .cal-day-more{color:rgba(255,255,255,.8)}

/* 拖拽目标高亮 */
.cal-day.drag-over{background:rgba(74,158,255,.2);border-color:var(--primary)}
.week-day-row.drag-over{border-color:var(--primary);background:rgba(74,158,255,.1)}

.cal-legend{
  display:flex;justify-content:center;gap:14px;padding:6px 0;
  font-size:12px;color:var(--muted);flex-wrap:wrap;
}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* 周视图 */
.week-grid{display:flex;flex-direction:column;gap:6px}
.week-day-row{
  display:flex;gap:8px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);cursor:pointer;
  transition:all .15s;
}
.week-day-row:hover{border-color:var(--primary)}
.week-day-row.today{border-color:var(--primary);background:rgba(74,158,255,.06)}
.week-day-row.selected{border-color:var(--primary);background:rgba(74,158,255,.1)}
.week-day-label{
  width:64px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-right:1px solid var(--border);padding-right:8px;
}
.week-day-name{font-size:12px;color:var(--muted)}
.week-day-num{font-size:20px;font-weight:700;margin-top:2px}
.week-day-row.today .week-day-num{color:var(--primary)}
.week-day-todos{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.week-todo-pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:4px;font-size:11px;font-weight:500;color:#fff;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:grab;transition:all .12s;
}
.week-todo-pill:hover{filter:brightness(1.1)}
.week-todo-pill.dragging{opacity:.4}
.week-todo-pill.selected{outline:2px solid var(--primary);outline-offset:2px}
.week-todo-pill.done{opacity:.65;text-decoration:line-through}
.week-day-empty{font-size:12px;color:var(--muted);opacity:.5}

/* 待办列表区域 */
.todo-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.todo-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
  flex-wrap:wrap;gap:8px;
}
.todo-header h2{font-size:16px;font-weight:600}
.todo-header-sub{font-size:12px;color:var(--muted)}
.search-box{
  width:100%;padding:9px 14px;border-radius:var(--radius);
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  margin-bottom:8px;
}
.search-box:focus{outline:none;border-color:var(--primary)}
.search-box::placeholder{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filter-tag{
  padding:5px 12px;border-radius:9999px;font-size:12px;font-weight:500;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  transition:all .15s;white-space:nowrap;cursor:pointer;
}
.filter-tag:hover{border-color:var(--primary);color:var(--text)}
.filter-tag.active{background:var(--primary);border-color:var(--primary);color:#fff}
.filter-tag .count{margin-left:4px;opacity:.8}

.todo-list{flex:1;overflow-y:auto;padding:0 20px 16px;display:flex;flex-direction:column;gap:8px}
.todo-item{
  display:flex;align-items:flex-start;gap:12px;padding:12px 14px;
  border-radius:var(--radius);background:var(--card);
  border:1px solid var(--border);border-left-width:4px;
  transition:all .15s;cursor:pointer;
}
.todo-item:hover{border-color:var(--primary)}
.todo-item.highlighted{background:rgba(74,158,255,.08);border-color:var(--primary);box-shadow:0 2px 8px rgba(74,158,255,.15)}
.todo-item.done{opacity:.6}
.todo-item.done .todo-title{text-decoration:line-through;color:var(--muted)}
.todo-checkbox{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;cursor:pointer;
}
.todo-checkbox:hover{border-color:var(--primary)}
.todo-checkbox.checked{background:var(--green);border-color:var(--green)}
.todo-checkbox.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:700}
.todo-content{flex:1;min-width:0}
.todo-title{font-weight:600;font-size:14px;margin-bottom:3px;word-break:break-word}
.todo-desc{font-size:12px;color:var(--muted);margin-bottom:6px;word-break:break-word}
.todo-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.todo-tag{
  display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
  border-radius:4px;font-size:11px;font-weight:500;
}
.todo-tag.priority{color:#fff}
.todo-tag.priority.red{background:var(--red)}
.todo-tag.priority.yellow{background:var(--yellow)}
.todo-tag.priority.blue{background:var(--blue)}
.todo-tag.priority.green{background:var(--green)}
.todo-tag.category{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.todo-tag.date{background:var(--bg);color:var(--muted)}
.todo-tag.overdue{background:rgba(255,71,87,.15);color:var(--red);border:1px solid rgba(255,71,87,.3)}
.todo-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.todo-item:hover .todo-actions{opacity:1}
.todo-actions button{
  width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--bg);font-size:13px;transition:all .15s;
}
.todo-actions button:hover{border-color:var(--primary)}
.todo-actions button.del:hover{border-color:var(--red);color:var(--red)}

/* 详情展开 */
.todo-detail{
  display:none;margin-top:8px;padding:10px 12px;
  background:var(--bg);border-radius:6px;border:1px solid var(--border);
  font-size:12px;color:var(--text);
}
.todo-detail.show{display:block}
.todo-detail .detail-row{display:flex;gap:8px;margin-bottom:4px}
.todo-detail .detail-label{color:var(--muted);min-width:60px}
.todo-detail .detail-value{color:var(--text);font-weight:500}

/* 空状态 */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--muted);text-align:center;
}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5}

.bottom-legend{
  display:flex;justify-content:center;gap:20px;padding:8px;
  border-top:1px solid var(--border);background:var(--card);font-size:12px;
  color:var(--muted);flex-shrink:0;flex-wrap:wrap;
}
.bottom-legend span{display:flex;align-items:center;gap:5px}
.bottom-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ============ 弹窗 ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,25,35,.45);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  width:90%;max-width:480px;max-height:90vh;overflow-y:auto;
  transform:translateY(20px);transition:transform .2s;
}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{
  width:30px;height:30px;border-radius:6px;font-size:18px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--muted)}
.form-input,.form-textarea,.form-select{
  width:100%;padding:10px 12px;border-radius:var(--radius);
  background:var(--bg);border:1px solid var(--border);color:var(--text);
}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:72px}
.priority-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.priority-btn{
  padding:10px;border-radius:var(--radius);border:2px solid var(--border);
  background:var(--bg);font-size:13px;font-weight:500;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.priority-btn .dot{width:10px;height:10px;border-radius:50%}
.priority-btn:hover{border-color:var(--muted)}
.priority-btn.selected{font-weight:600}
.priority-btn.selected[data-p="red"]{border-color:var(--red);background:rgba(255,71,87,.12)}
.priority-btn.selected[data-p="yellow"]{border-color:var(--yellow);background:rgba(255,165,2,.12)}
.priority-btn.selected[data-p="blue"]{border-color:var(--blue);background:rgba(74,158,255,.12)}
.priority-btn.selected[data-p="green"]{border-color:var(--green);background:rgba(46,213,115,.12)}
.modal-footer{
  display:flex;justify-content:flex-end;gap:10px;
  padding:16px 20px;border-top:1px solid var(--border);
}
.error-msg{color:var(--red);font-size:12px;margin-top:8px;display:none}
.error-msg.show{display:block}

.confirm-modal{max-width:360px}
.confirm-modal .modal-body{text-align:center;padding:24px 20px}
.confirm-icon{font-size:40px;margin-bottom:12px}
.confirm-text{font-size:14px;color:var(--text);margin-bottom:4px}
.confirm-sub{font-size:12px;color:var(--muted)}

/* 拖拽确认弹窗 */
.drag-confirm-modal{max-width:380px}
.drag-confirm-modal .modal-body{text-align:center;padding:24px 20px}
.drag-confirm-icon{font-size:40px;margin-bottom:12px}
.drag-confirm-text{font-size:15px;font-weight:500;margin-bottom:4px}
.drag-confirm-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.drag-confirm-tags{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.drag-mode-indicator{
  display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;
}
.drag-mode-indicator.forward{background:rgba(255,71,87,.15);color:var(--red)}
.drag-mode-indicator.backward{background:rgba(74,158,255,.15);color:var(--blue)}

.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
  padding:10px 20px;border-radius:var(--radius);background:var(--card);
  border:1px solid var(--border);color:var(--text);font-size:13px;
  z-index:2000;opacity:0;transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.import-options{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.import-option{
  padding:14px;border-radius:var(--radius);border:2px solid var(--border);
  background:var(--bg);cursor:pointer;transition:all .15s;text-align:left;
}
.import-option:hover{border-color:var(--primary)}
.import-option.selected{border-color:var(--primary);background:rgba(74,158,255,.08)}
.import-option-title{font-weight:600;font-size:14px;margin-bottom:4px}
.import-option-desc{font-size:12px;color:var(--muted)}

.context-menu{
  position:fixed;z-index:3000;min-width:160px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 4px 16px rgba(0,0,0,.15);padding:4px;
  opacity:0;pointer-events:none;transform:scale(.95);transition:all .12s;
}
.context-menu.show{opacity:1;pointer-events:auto;transform:scale(1)}
.context-menu-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-radius:6px;font-size:13px;cursor:pointer;transition:background .12s;
}
.context-menu-item:hover{background:var(--bg)}
.context-menu-header{
  padding:6px 12px 8px;font-size:11px;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:4px;
}

.history-modal{max-width:720px}
.history-filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.history-field{display:flex;flex-direction:column;gap:4px}
.history-field label{font-size:12px;color:var(--muted);font-weight:500}
.history-field input,.history-field select{
  padding:8px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:13px;
}
.history-field input:focus,.history-field select:focus{outline:none;border-color:var(--primary)}
.history-summary{
  display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:12px;
  border-radius:var(--radius);background:var(--bg);font-size:13px;
}
.history-results{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.history-result-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
  border-radius:6px;border:1px solid var(--border);border-left-width:3px;
  background:var(--card);
}
.history-result-item.done{opacity:.65}
.history-result-item .h-date{
  font-family:monospace;font-size:12px;color:var(--muted);white-space:nowrap;
  padding:2px 6px;background:var(--bg);border-radius:4px;
}
.history-result-item .h-title{font-size:13px;font-weight:500}
.history-result-item .h-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.history-empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}

/* 拖拽幽灵元素 */
.drag-ghost{
  position:fixed;pointer-events:none;z-index:5000;
  padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:#fff;
  transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(0,0,0,.25);
  max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  opacity:.9;
}

/* ============ 响应式 ============ */
@media(max-width:1024px){
  .calendar-panel{width:380px}
}
@media(max-width:768px){
  .topbar{flex-wrap:wrap;gap:8px;padding:8px 14px}
  .topbar-sub{display:none}
  .topbar-actions .btn span{display:none}
  .topbar-actions .btn{padding:8px 10px}
  .stats{padding:6px 14px;gap:6px}
  .stat-item{padding:4px 8px;font-size:12px}
  .main{flex-direction:column}
  .calendar-panel{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:55vh}
  .todo-panel{flex:1;min-height:0}
  .todo-header{padding:10px 14px}
  .todo-list{padding:0 14px 14px}

<script>
/* ============================================================
   智能日历助手 v3.0
   单文件HTML · 零依赖 · localStorage本地存储
   ============================================================ */

const STORAGE_KEY = 'magong_todo_calendar';
const PRIORITY = {red:'紧急',yellow:'次要',blue:'正常',green:'已完成'};
const PRIORITY_COLOR = {red:'#ff4757',yellow:'#ffa502',blue:'#4a9eff',green:'#2ed573'};
const PRIORITY_ORDER = {red:0,yellow:1,blue:2,green:3};
const WEEK_NAMES = ['周日','周一','周二','周三','周四','周五','周六'];

// 状态
let todos = [];
let currentDate = new Date();
let weekRefDate = new Date();
let selectedDate = null;
let currentFilter = 'all';
let searchKeyword = '';
let editingId = null;
let selectedPriority = 'blue';
let pendingImportData = null;
let importMode = 'merge';
let pendingDeleteId = null;
let currentView = 'month';
let highlightedTodoId = null;   // 高亮的待办ID
let expandedTodoId = null;       // 展开详情的待办ID

// 拖拽状态
let dragState = null; // { todoId, fromDate, ghostEl }
let pendingDragMove = null; // { todoId, newDate }

// ============ 工具函数 ============
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
}
function getWeekStart(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function getWeekDayName(dateStr){
  const d = new Date(dateStr);
  return WEEK_NAMES[d.getDay()];
}
function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============ 数据层 ============
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      todos = JSON.parse(raw);
    } else {
      const today = new Date();
      const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
      const day5 = new Date(today); day5.setDate(today.getDate()+5);
      todos = [
        {id:genId(), title:'天加商空芯片项目 - 供应商询价推进', desc:'跟京西确认20-26P范围BOM物料报价，推进供应商询价', date:fmtDate(today), priority:'red', category:'项目', done:false, created:Date.now()},
        {id:genId(), title:'CostGuardian BOM核算模块开发', desc:'完成成本核算核心逻辑和报价单回写功能', date:fmtDate(tomorrow), priority:'yellow', category:'成本', done:false, created:Date.now()-1000},
        {id:genId(), title:'库存账龄自动填充脚本优化', desc:'优化Excel宏脚本，支持多sheet批量处理', date:fmtDate(day5), priority:'blue', category:'采购', done:false, created:Date.now()-2000},
        {id:genId(), title:'周小红简历排版迭代', desc:'调整排版格式，优化项目经历描述', date:fmtDate(today), priority:'green', category:'其他', done:true, created:Date.now()-3000},
      ];
      saveData();
    }
  } catch(e){
    console.error('加载数据失败:', e);
    todos = [];
  }
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  } catch(e){
    console.error('保存数据失败:', e);
    showToast('⚠️ 数据保存失败');
  }
}

// ============ 视图切换 ============
function switchView(view){
  currentView = view;
  document.getElementById('btnMonthView').classList.toggle('active', view === 'month');
  document.getElementById('btnWeekView').classList.toggle('active', view === 'week');
  document.getElementById('monthViewSection').style.display = view === 'month' ? '' : 'none';
  document.getElementById('weekViewSection').style.display = view === 'week' ? '' : 'none';
  renderCalendar();
}

// ============ 日历渲染入口 ============
function renderCalendar(){
  if(currentView === 'month'){
    renderMonthView();
  } else {
    renderWeekView();
  }
}

// ============ 月视图渲染 ============
function renderMonthView(){
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent = `${year}年${monthNames[month]}`;

  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('calWeekdays').innerHTML = weekdays.map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevMonthLastDay = new Date(year, month, 0).getDate();
  const today = todayStr();
  let html = '';

  for(let i = startWeekday-1; i >= 0; i--){
    const day = prevMonthLastDay - i;
    html += `<div class="cal-day other-month"><div class="cal-day-header"><span class="cal-day-num">${day}</span></div></div>`;
  }

  for(let day = 1; day <= daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = dateStr === today;
    const isSelected = dateStr === selectedDate;
    const dayTodos = todos.filter(t => t.date === dateStr);
    const sortedDayTodos = dayTodos.sort((a,b) => {
      const pa = a.done ? 3 : PRIORITY_ORDER[a.priority];
      const pb = b.done ? 3 : PRIORITY_ORDER[b.priority];
      return pa - pb;
    });

    let todosHtml = '';
    const MAX_DISPLAY = 3;
    const displayTodos = sortedDayTodos.slice(0, MAX_DISPLAY);
    displayTodos.forEach(t => {
      const p = t.done ? 'green' : t.priority;
      const title = escapeHtml(t.title.length > 14 ? t.title.slice(0,14)+'…' : t.title);
      todosHtml += `<div class="cal-day-todo-item ${t.done?'done':''}" 
        style="background:${PRIORITY_COLOR[p]}" 
        draggable="true" data-todo-id="${t.id}" data-date="${dateStr}"
        onclick="event.stopPropagation();onCalendarTodoClick('${t.id}','${dateStr}')">${title}</div>`;
    });
    if(sortedDayTodos.length > MAX_DISPLAY){
      todosHtml += `<div class="cal-day-more">+${sortedDayTodos.length - MAX_DISPLAY} 更多</div>`;
    }
    if(sortedDayTodos.length === 0){
      todosHtml = '';
    }

    const classes = ['cal-day'];
    if(isToday) classes.push('today');
    if(isSelected) classes.push('selected');
    html += `<div class="${classes.join(' ')}" data-date="${dateStr}" 
      onclick="selectDate('${dateStr}')" 
      oncontextmenu="showContextMenu(event,'${dateStr}');return false">
      <div class="cal-day-header"><span class="cal-day-num">${day}</span></div>
      <div class="cal-day-todos">${todosHtml}</div>
    </div>`;
  }

  const totalCells = startWeekday + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for(let i = 1; i <= remaining; i++){
    html += `<div class="cal-day other-month"><div class="cal-day-header"><span class="cal-day-num">${i}</span></div></div>`;
  }
  document.getElementById('calGrid').innerHTML = html;

  bindMonthDragEvents();
}

// ============ 周视图渲染 ============
function renderWeekView(){
  const weekStart = getWeekStart(weekRefDate);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  const today = todayStr();

  const sameMonth = weekStart.getMonth() === weekEnd.getMonth();
  const startStr = `${weekStart.getMonth()+1}月${weekStart.getDate()}日`;
  const endStr = sameMonth ? `${weekEnd.getDate()}日` : `${weekEnd.getMonth()+1}月${weekEnd.getDate()}日`;
  document.getElementById('weekTitle').textContent = `${startStr} - ${endStr}`;

  const dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  let html = '';

  for(let i = 0; i < 7; i++){
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const dateStr = fmtDate(d);
    const isToday = dateStr === today;
    const isSelected = dateStr === selectedDate;
    const dayTodos = todos.filter(t => t.date === dateStr);
    const sortedDayTodos = dayTodos.sort((a,b) => {
      const pa = a.done ? 3 : PRIORITY_ORDER[a.priority];
      const pb = b.done ? 3 : PRIORITY_ORDER[b.priority];
      return pa - pb;
    });

    const classes = ['week-day-row'];
    if(isToday) classes.push('today');
    if(isSelected) classes.push('selected');

    let todosHtml = '';
    if(sortedDayTodos.length > 0){
      todosHtml = sortedDayTodos.map(t => {
        const p = t.done ? 'green' : t.priority;
        const title = escapeHtml(t.title.length > 22 ? t.title.slice(0,22)+'…' : t.title);
        return `<span class="week-todo-pill ${t.done?'done':''}" 
          style="background:${PRIORITY_COLOR[p]}" 
          draggable="true" data-todo-id="${t.id}" data-date="${dateStr}"
          title="${escapeHtml(t.title)}"
          onclick="event.stopPropagation();onCalendarTodoClick('${t.id}','${dateStr}')">
          ${title}
        </span>`;
      }).join('');
    } else {
      todosHtml = '<span class="week-day-empty">无待办</span>';
    }

    html += `<div class="${classes.join(' ')}" data-date="${dateStr}" 
      onclick="selectDate('${dateStr}')" 
      oncontextmenu="showContextMenu(event,'${dateStr}');return false">
      <div class="week-day-label">
        <div class="week-day-name">${dayNames[i]}</div>
        <div class="week-day-num">${d.getDate()}</div>
      </div>
      <div class="week-day-todos">${todosHtml}</div>
    </div>`;
  }

  document.getElementById('weekGrid').innerHTML = html;

  bindWeekDragEvents();
}

  const d = new Date(weekRefDate);
  d.setDate(d.getDate() + delta * 7);
  weekRefDate = d;
  renderWeekView();

// ============ 拖拽功能 ============
function bindMonthDragEvents(){
  const grid = document.getElementById('calGrid');
  if(!grid) return;

  grid.querySelectorAll('.cal-day-todo-item[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', onTodoDragStart);
    el.addEventListener('dragend', onTodoDragEnd);
  });

  grid.querySelectorAll('.cal-day').forEach(dayEl => {
    dayEl.addEventListener('dragover', onDayDragOver);
    dayEl.addEventListener('dragleave', onDayDragLeave);
    dayEl.addEventListener('drop', onDayDrop);
  });
}

function bindWeekDragEvents(){
  const grid = document.getElementById('weekGrid');
  if(!grid) return;

  grid.querySelectorAll('.week-todo-pill[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', onTodoDragStart);
    el.addEventListener('dragend', onTodoDragEnd);
  });

  grid.querySelectorAll('.week-day-row').forEach(row => {
    row.addEventListener('dragover', onDayDragOver);
    row.addEventListener('dragleave', onDayDragLeave);
    row.addEventListener('drop', onDayDrop);
  });
}

function onTodoDragStart(e){
  const todoId = this.dataset.todoId;
  const fromDate = this.dataset.date;
  const todo = todos.find(t => t.id === todoId);
  if(!todo) return;

  dragState = { todoId, fromDate };
  this.classList.add('dragging');

  // 创建幽灵元素
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.style.background = PRIORITY_COLOR[todo.done ? 'green' : todo.priority];
  ghost.textContent = todo.title.length > 20 ? todo.title.slice(0,20)+'…' : todo.title;
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
  document.body.appendChild(ghost);
  dragState.ghostEl = ghost;

  document.addEventListener('dragover', onGhostMove);
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', todoId); } catch(err){}
}

function onGhostMove(e){
  if(dragState && dragState.ghostEl){
    dragState.ghostEl.style.left = e.clientX + 'px';
    dragState.ghostEl.style.top = e.clientY + 'px';
  }
}

function onTodoDragEnd(e){
  this.classList.remove('dragging');
  document.removeEventListener('dragover', onGhostMove);

  if(dragState && dragState.ghostEl){
    dragState.ghostEl.remove();
  }

  // 清理所有 drag-over 状态
  document.querySelectorAll('.cal-day.drag-over,.week-day-row.drag-over').forEach(el => {
    el.classList.remove('drag-over');
  });

  dragState = null;
}

function onDayDragOver(e){
  e.preventDefault();
  e.stopPropagation();
  const target = e.currentTarget;
  target.classList.add('drag-over');
  e.dataTransfer.dropEffect = 'move';
}

function onDayDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}

function onDayDrop(e){
  e.preventDefault();
  e.stopPropagation();
  const target = e.currentTarget;
  target.classList.remove('drag-over');

  if(!dragState) return;
  const newDate = target.dataset.date;
  const oldDate = dragState.fromDate;
  const todoId = dragState.todoId;

  if(!newDate || newDate === oldDate){
    dragState = null;
    return;
  }

  pendingDragMove = { todoId, oldDate, newDate };
  showDragConfirm();
}

function showDragConfirm(){
  if(!pendingDragMove) return;
  const todo = todos.find(t => t.id === pendingDragMove.todoId);
  if(!todo){ pendingDragMove = null; return; }

  const oldDate = pendingDragMove.oldDate;
  const newDate = pendingDragMove.newDate;
  const oldD = new Date(oldDate);
  const newD = new Date(newDate);
  const isForward = newD < oldD; // 往前拖（更早的日期）= 提高优先级
  const isBackward = newD > oldD; // 往后拖（更晚的日期）= 延期

  const dayDiff = Math.round((newD - oldD) / (1000*60*60*24));

  const modal = document.getElementById('dragConfirmModal');
  const icon = document.getElementById('dragConfirmIcon');
  const text = document.getElementById('dragConfirmText');
  const sub = document.getElementById('dragConfirmSub');
  const tags = document.getElementById('dragConfirmTags');

  if(isForward){
    // 往前拖：提高优先级
    icon.textContent = '⬆️';
    text.textContent = `提高优先级到 ${newDate}（${getWeekDayName(newDate)}）`;
    sub.textContent = `从 ${oldDate}（${getWeekDayName(oldDate)}）提前 ${dayDiff} 天`;
    tags.innerHTML = `<span class="drag-mode-indicator forward">⚠️ 提前</span>`;
  } else if(isBackward){
    // 往后拖：延期
    icon.textContent = '⏭️';
    text.textContent = `延期到 ${newDate}（${getWeekDayName(newDate)}）`;
    sub.textContent = `从 ${oldDate}（${getWeekDayName(oldDate)}）延后 ${dayDiff} 天`;
    tags.innerHTML = `<span class="drag-mode-indicator backward">📅 延期</span>`;
  }

  modal.classList.add('show');
}

function confirmDragMove(){
  if(!pendingDragMove) return;
  const todo = todos.find(t => t.id === pendingDragMove.todoId);
  if(todo){
    const oldDate = todo.date;
    todo.date = pendingDragMove.newDate;
    saveData();
    closeDragConfirm();
    const action = new Date(pendingDragMove.newDate) < new Date(pendingDragMove.oldDate) ? '⬆️ 已提前' : '⏭️ 已延期';
    showToast(`${action}：${oldDate} → ${pendingDragMove.newDate}`);
    highlightedTodoId = todo.id;
    selectedDate = pendingDragMove.newDate;
    renderCalendar();
    renderTodos();
  }
  pendingDragMove = null;
}

function cancelDragMove(){
  closeDragConfirm();
  pendingDragMove = null;
}

function closeDragConfirm(){
  document.getElementById('dragConfirmModal').classList.remove('show');
}

      <span class="stat-num">${counts.all}</span><span class="stat-label">待办</span>
    </div>
    <div class="stat-item ${currentFilter==='red'?'active':''}" onclick="setFilter('red')">
      <span class="stat-dot" style="background:var(--red)"></span><span class="stat-num">${counts.red}</span><span class="stat-label">紧急</span>
    </div>
    <div class="stat-item ${currentFilter==='yellow'?'active':''}" onclick="setFilter('yellow')">
      <span class="stat-dot" style="background:var(--yellow)"></span><span class="stat-num">${counts.yellow}</span><span class="stat-label">次要</span>
    </div>

    </div>

  const filters = [

// ============ 待办列表 ============
function getFilteredTodos(){
  searchKeyword = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const today = todayStr();
  let result = [...todos];
  if(selectedDate) result = result.filter(t => t.date === selectedDate);
  switch(currentFilter){
    case 'all': result = result.filter(t=>!t.done); break;
    case 'red': result = result.filter(t=>t.priority==='red' && !t.done); break;
    case 'yellow': result = result.filter(t=>t.priority==='yellow' && !t.done); break;
    case 'blue': result = result.filter(t=>t.priority==='blue' && !t.done); break;
    case 'green': result = result.filter(t=>t.done); break;
    case 'overdue': result = result.filter(t=>t.date<today && !t.done); break;
  }
  if(searchKeyword){
    result = result.filter(t =>
      t.title.toLowerCase().includes(searchKeyword) ||
      (t.desc && t.desc.toLowerCase().includes(searchKeyword))
    );
  }
  // 排序：按日期升序，再按优先级
  result.sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    const dateCmp = (a.date||'').localeCompare(b.date||'');
    if(dateCmp !== 0) return dateCmp;
    return (PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
  });
  return result;
}

function renderTodos(){
  const list = getFilteredTodos();
  const today = todayStr();
  let headerSub = '所有待办';
  if(selectedDate){
    const d = new Date(selectedDate);
    headerSub = `${d.getMonth()+1}月${d.getDate()}日（${getWeekDayName(selectedDate)}）的待办`;
  }
  if(currentFilter !== 'all'){
    const filterNames = {red:'紧急',yellow:'次要',blue:'正常',green:'已完成',overdue:'逾期'};
    headerSub += ` · ${filterNames[currentFilter]||''}`;
  }
  document.getElementById('todoHeaderSub').textContent = headerSub;

  if(list.length === 0){
    document.getElementById('todoList').innerHTML = `
      <div class="empty-state">
        <div class="icon">📝</div>
        <div>暂无待办事项</div>
        <div style="font-size:12px;margin-top:4px">点击右上角"新建"创建待办</div>
      </div>`;
    return;
  }

  document.getElementById('todoList').innerHTML = list.map(t => {
    const isOverdue = !t.done && t.date && t.date < today;
    const priority = t.done ? 'green' : t.priority;
    const borderColor = PRIORITY_COLOR[priority];
    const isHighlighted = t.id === highlightedTodoId;
    const isExpanded = t.id === expandedTodoId;
    return `
      <div class="todo-item ${t.done?'done':''} ${isHighlighted?'highlighted':''}" 
        style="border-left-color:${borderColor}" 
        onclick="onTodoItemClick('${t.id}')" 
        oncontextmenu="showTodoContextMenu(event,'${t.id}');return false">
        <div class="todo-checkbox ${t.done?'checked':''}" onclick="event.stopPropagation();toggleDone('${t.id}')"></div>
        <div class="todo-content">
          <div class="todo-title">${escapeHtml(t.title)}</div>
          ${t.desc ? `<div class="todo-desc">${escapeHtml(t.desc)}</div>` : ''}
          <div class="todo-meta">
            <span class="todo-tag priority ${priority}">${PRIORITY[priority]}</span>
            ${t.category ? `<span class="todo-tag category">${escapeHtml(t.category)}</span>` : ''}
            ${t.date ? `<span class="todo-tag date">📅 ${t.date}</span>` : ''}
            ${isOverdue ? '<span class="todo-tag overdue">⏰ 逾期</span>' : ''}
          </div>
          ${isExpanded ? `
          <div class="todo-detail show">
            <div class="detail-row"><span class="detail-label">标题</span><span class="detail-value">${escapeHtml(t.title)}</span></div>
            ${t.desc ? `<div class="detail-row"><span class="detail-label">描述</span><span class="detail-value">${escapeHtml(t.desc)}</span></div>` : ''}
            <div class="detail-row"><span class="detail-label">日期</span><span class="detail-value">${t.date ? t.date+'（'+getWeekDayName(t.date)+'）' : '未设置'}</span></div>
            <div class="detail-row"><span class="detail-label">优先级</span><span class="detail-value">${PRIORITY[priority]}</span></div>
            ${t.category ? `<div class="detail-row"><span class="detail-label">分类</span><span class="detail-value">${escapeHtml(t.category)}</span></div>` : ''}
            <div class="detail-row"><span class="detail-label">状态</span><span class="detail-value">${t.done ? '✅ 已完成' : '⏳ 未完成'}</span></div>
          </div>` : ''}
        </div>
        <div class="todo-actions">
          <button onclick="event.stopPropagation();showPostponeModal('${t.id}')" title="延期">⏰</button>
          <button onclick="event.stopPropagation();openModal('${t.id}')" title="编辑">✏️</button>
          <button class="del" onclick="event.stopPropagation();confirmDelete('${t.id}')" title="删除">🗑️</button>
        </div>
      </div>`;
  }).join('');
}

function onTodoItemClick(id){
  if(expandedTodoId === id){
    expandedTodoId = null;
  } else {
    expandedTodoId = id;
    highlightedTodoId = id;
  }
  renderTodos();
}

// ============ 完成切换 ============
function toggleDone(id){
  const t = todos.find(t=>t.id===id);
  if(!t) return;
  t.done = !t.done;
  if(t.done){
    if(!t._origPriority) t._origPriority = t.priority;
    t.priority = 'green';
  } else {
    t.priority = t._origPriority || 'blue';
    delete t._origPriority;
  }
  saveData();
  renderAll();
}

// ============ 弹窗 ============
function openModal(id, defaultDate){
  editingId = id || null;
  if(id){
    const t = todos.find(t=>t.id===id);
    if(!t) return;
    document.getElementById('modalTitle').textContent = '编辑待办';
    document.getElementById('todoTitle').value = t.title || '';
    document.getElementById('todoDesc').value = t.desc || '';
    document.getElementById('todoDate').value = t.date || '';
    document.getElementById('todoCategory').value = t.category || '';
    selectPriority(t.priority);
  } else {
    document.getElementById('modalTitle').textContent = '新建待办';
    document.getElementById('todoTitle').value = '';
    document.getElementById('todoDesc').value = '';
    document.getElementById('todoDate').value = defaultDate || selectedDate || todayStr();
    document.getElementById('todoCategory').value = '';
    selectPriority('blue');
  }
  document.getElementById('titleError').classList.remove('show');
  document.getElementById('todoModal').classList.add('show');
  setTimeout(()=>document.getElementById('todoTitle').focus(), 100);
}

function closeModal(){
  document.getElementById('todoModal').classList.remove('show');
  editingId = null;
}

function selectPriority(p){
  selectedPriority = p;
  document.querySelectorAll('.priority-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.p === p);
  });
}

function saveTodo(){
  const title = document.getElementById('todoTitle').value.trim();
  if(!title){
    document.getElementById('titleError').classList.add('show');
    return;
  }
  const data = {
    title,
    desc: document.getElementById('todoDesc').value.trim(),
    date: document.getElementById('todoDate').value || todayStr(),
    category: document.getElementById('todoCategory').value,
    priority: selectedPriority,
  };
  if(editingId){
    const t = todos.find(t=>t.id===editingId);
    if(t){
      Object.assign(t, data);
      if(data.priority === 'green' && !t.done) t.done = true;
      else if(data.priority !== 'green' && t.done){ t.done = false; delete t._origPriority; }
    }
    showToast('✅ 已更新');
  } else {
    todos.push({ id: genId(), ...data, done: data.priority === 'green', created: Date.now() });
    showToast('✅ 已新建');
  }
  saveData();
  closeModal();
  renderAll();
}

// ============ 删除 ============
function confirmDelete(id){
  pendingDeleteId = id;
  const t = todos.find(t=>t.id===id);
  if(t) document.getElementById('confirmText').textContent = `确认删除"${t.title}"吗？`;
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm(){
  document.getElementById('confirmModal').classList.remove('show');
  pendingDeleteId = null;
}
document.getElementById('confirmDelBtn').onclick = function(){
  if(pendingDeleteId){
    todos = todos.filter(t=>t.id!==pendingDeleteId);
    saveData();
    renderAll();
    showToast('🗑️ 已删除');
  }
  closeConfirm();
};

// ============ 导入导出 ============
function exportData(){
  const data = JSON.stringify(todos, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `待办备份_${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📤 已导出备份');
}

function handleImport(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('格式错误');
      pendingImportData = data;
      document.getElementById('importCount').textContent = data.length;
      importMode = 'merge';
      document.querySelectorAll('.import-option').forEach(opt => {
        opt.classList.toggle('selected', opt.dataset.mode === 'merge');
      });
      document.getElementById('importModal').classList.add('show');
    } catch(err){
      showToast('❌ 文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function selectImportMode(mode){
  importMode = mode;
  document.querySelectorAll('.import-option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.mode === mode);
  });
}
function closeImport(){
  document.getElementById('importModal').classList.remove('show');
  pendingImportData = null;
}
function doImport(){
  if(!pendingImportData) return;
  if(importMode === 'replace') todos = [...pendingImportData];
  else todos = [...todos, ...pendingImportData];
  saveData();
  closeImport();
  renderAll();
  showToast(`✅ 已导入 ${pendingImportData.length} 条数据`);
}

// ============ 历史查询 ============
function openHistory(){
  const today = new Date();
  const start = new Date(today);
  start.setDate(today.getDate() - 30);
  document.getElementById('historyStart').value = fmtDate(start);
  document.getElementById('historyEnd').value = fmtDate(today);
  document.getElementById('historyPriority').value = '';
  document.getElementById('historyCategory').value = '';
  document.getElementById('historyStatus').value = '';
  document.getElementById('historySummary').style.display = 'none';
  document.getElementById('historyResults').innerHTML = '<div class="history-empty">设置查询条件后点击「查询」按钮</div>';
  document.getElementById('historyModal').classList.add('show');
  runHistoryQuery();
}
function closeHistory(){
  document.getElementById('historyModal').classList.remove('show');
}

function runHistoryQuery(){
  const start = document.getElementById('historyStart').value;
  const end = document.getElementById('historyEnd').value;
  const priority = document.getElementById('historyPriority').value;
  const category = document.getElementById('historyCategory').value;
  const status = document.getElementById('historyStatus').value;
  const today = todayStr();
  let result = [...todos];
  if(start) result = result.filter(t => t.date >= start);
  if(end) result = result.filter(t => t.date <= end);
  if(priority) result = result.filter(t => (t.done ? 'green' : t.priority) === priority);
  if(category) result = result.filter(t => t.category === category);
  if(status === 'undone') result = result.filter(t => !t.done);
  else if(status === 'done') result = result.filter(t => t.done);
  else if(status === 'overdue') result = result.filter(t => !t.done && t.date < today);
  result.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const summary = document.getElementById('historySummary');
  const doneCount = result.filter(t=>t.done).length;
  const undoneCount = result.filter(t=>!t.done).length;
  const overdueCount = result.filter(t=>!t.done && t.date<today).length;
  summary.style.display = 'flex';
  summary.innerHTML = `
    <span>查询结果：<b style="color:var(--text)">${result.length}</b> 条</span>
    <span style="color:var(--muted)">|</span>
    <span>已完成 <b style="color:var(--green)">${doneCount}</b></span>
    <span>未完成 <b style="color:var(--blue)">${undoneCount}</b></span>
    ${overdueCount > 0 ? `<span>逾期 <b style="color:var(--red)">${overdueCount}</b></span>` : ''}
    <span style="color:var(--muted);margin-left:auto">${start||'不限'} ~ ${end||'不限'}</span>`;

  const resultsEl = document.getElementById('historyResults');
  if(result.length === 0){
    resultsEl.innerHTML = '<div class="history-empty">📭 未查询到匹配的待办记录</div>';
    return;
  }
  resultsEl.innerHTML = result.map(t => {
    const p = t.done ? 'green' : t.priority;
    const isOverdue = !t.done && t.date < today;
    return `
      <div class="history-result-item ${t.done?'done':''}" style="border-left-color:${PRIORITY_COLOR[p]}">
        <span class="h-date">${t.date||'未设日期'}</span>
        <div style="flex:1;min-width:0">
          <div class="h-title">${escapeHtml(t.title)}${t.done?' <span style="color:var(--green)">✓</span>':''}</div>
          ${t.desc ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(t.desc)}</div>` : ''}
          <div class="h-tags">
            <span class="todo-tag priority ${p}">${PRIORITY[p]}</span>
            ${t.category ? `<span class="todo-tag category">${escapeHtml(t.category)}</span>` : ''}
            ${isOverdue ? '<span class="todo-tag overdue">⏰ 逾期</span>' : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ============ 全局事件绑定 ============
document.addEventListener('click', function(e){
  if(!e.target.closest('#contextMenu')) hideContextMenu();
  if(!e.target.closest('#todoContextMenu')) hideTodoContextMenu();
});
document.addEventListener('scroll', hideContextMenu, true);
document.addEventListener('scroll', hideTodoContextMenu, true);

// 快捷键 - 修复CTRL+V和Escape问题
document.addEventListener('keydown', function(e){
  const active = document.activeElement;
  const isInputFocused = active && (
    active.tagName === 'INPUT' ||
    active.tagName === 'TEXTAREA' ||
    active.tagName === 'SELECT' ||
    active.isContentEditable
  );

  if(e.key === 'Escape'){
    // 只在非输入焦点或按下Escape时才关闭，但始终允许Escape关闭弹窗
    // 这是预期行为：Escape应该关闭弹窗
    closeModal();
    closeConfirm();
    closeImport();
    closeHistory();
    closePostpone();
    closeDragConfirm();
    hideContextMenu();
    hideTodoContextMenu();
    return;
  }

  if(!isInputFocused && (e.key === 'n' || e.key === 'N')){
    e.preventDefault();
    openModal();
  }
});

// 弹窗遮罩关闭
document.getElementById('todoModal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
document.getElementById('confirmModal').addEventListener('click', function(e){
  if(e.target === this) closeConfirm();
});
document.getElementById('importModal').addEventListener('click', function(e){
  if(e.target === this) closeImport();
});
document.getElementById('historyModal').addEventListener('click', function(e){
  if(e.target === this) closeHistory();
});
document.getElementById('postponeModal').addEventListener('click', function(e){
  if(e.target === this) closePostpone();
});
document.getElementById('dragConfirmModal').addEventListener('click', function(e){
  if(e.target === this) cancelDragMove();
});

// ============ 全局渲染 ============
function renderAll(){
  renderStats();
  renderFilters();
  renderCalendar();
  renderTodos();
}

// ============ 启动 ============
loadData();
renderAll();
</script>
